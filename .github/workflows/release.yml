name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from main, e.g. 3.0.1 (must match package.json and src/data/changelog.json). The release step creates the v<version> tag.'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  verify-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Manual releases must come from main and use a new tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release workflow from main (got $GITHUB_REF)"
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 3.0.1 or 3.1.0-beta.1"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Tag must match package.json and the in-app changelog
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CHANGELOG_VERSION=$(node -p "require('./src/data/changelog.json').version")
          echo "tag=$TAG_VERSION package.json=$PACKAGE_VERSION changelog=$CHANGELOG_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json ($PACKAGE_VERSION) and src/data/changelog.json ($CHANGELOG_VERSION)"
            exit 1
          fi

  build-windows:
    needs: verify-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:win -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-build
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:linux -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  build-macos:
    needs: verify-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:mac -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-rc') }}
