name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag must match package.json and the in-app changelog
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          CHANGELOG_VERSION=$(node -p "require('./src/data/changelog.json').version")
          echo "tag=$TAG_VERSION package.json=$PACKAGE_VERSION changelog=$CHANGELOG_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PACKAGE_VERSION) and src/data/changelog.json ($CHANGELOG_VERSION)"
            exit 1
          fi

  build-windows:
    needs: verify-version
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:win -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-build
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:linux -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  build-macos:
    needs: verify-version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build Electron app
        run: npm run dist:mac -- --publish never
        env:
          EVE_CLIENT_ID: ${{ secrets.EVE_CLIENT_ID }}
          REF_API_KEY: ${{ secrets.REF_API_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
