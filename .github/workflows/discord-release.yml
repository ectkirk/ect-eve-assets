name: Discord Release Notification

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: windows-latest
    steps:
      - name: Post to Discord
        # Release values are passed as environment variables, never pasted into
        # the script, so quotes or code in release notes cannot break or run in it.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $releaseBody = "$env:RELEASE_BODY"
          if ($releaseBody.Length -gt 500) { $releaseBody = $releaseBody.Substring(0, 500) }
          $body = @{
            embeds = @(@{
              title = "New Release: $env:RELEASE_NAME"
              description = $releaseBody
              url = $env:RELEASE_URL
              color = 3066993
              fields = @(
                @{ name = "Version"; value = $env:RELEASE_TAG; inline = $true }
                @{ name = "Author"; value = $env:RELEASE_AUTHOR; inline = $true }
                @{ name = "Repository"; value = $env:REPOSITORY; inline = $true }
              )
            })
          } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType "application/json" -Body $body
